<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=./registro.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al registro</title>
    <style>
        :root {
            --red: #e10600;
            --bg: #090909;
            --panel: rgba(18, 18, 18, 0.9);
            --line: rgba(255, 255, 255, 0.1);
            --text: #f4f4f4;
            --muted: #b8b8b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(225, 6, 0, 0.2), transparent 28%),
                linear-gradient(135deg, #040404 0%, #141414 100%);
        }

        .card {
            width: min(100%, 560px);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--red);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            margin-top: 22px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff392f 0%, #e10600 100%);
            color: white;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">MotoGP Registry</p>
        <h1>Redirigiendo al formulario</h1>
        <p>
            Esta ruta redirige automaticamente a la pagina principal del registro.
            Si no ocurre en unos segundos, puedes abrirla manualmente desde el boton.
        </p>
        <div class="actions">
            <a class="button" href="./registro.html">Ir a registro.html</a>
        </div>
    </main>
</body>
</html>
