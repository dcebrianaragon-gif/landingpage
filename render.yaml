services:
  - type: web
    runtime: node
    name: motogp-experience
    plan: starter
    buildCommand: npm install && cd minijuego && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATA_FILE
        value: /var/data/fichajeregistros.json
    disk:
      name: registros
      mountPath: /var/data
      sizeGB: 10
